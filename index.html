<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏰 魔法學園：Maths Dollars 管理系統 🔮</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --color-yuanman: #f87171;
      --color-sansi: #fbbf24;
      --color-fangcun: #34d399;
      --primary-blue: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      margin: 0;
      padding: 12px 12px 80px 12px; /* 底部預留 80px 給手機導覽列 */
      color: #f8fafc;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 頂部標題 */
    header { text-align: center; margin-bottom: 14px; }
    header h1 { margin: 4px 0; font-size: 1.5rem; color: var(--primary-blue); }
    
    .role-badge {
      display: inline-block;
      background: rgba(15, 23, 42, 0.8);
      color: #fbbf24;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #fbbf24;
    }

    /* 手機版三大社系總分縮小並排 */
    .dashboard-houses {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      text-align: center;
    }
    .house-card {
      padding: 10px 4px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      color: white;
    }
    .house-card.yuanman { background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); border: 1px solid #f87171; }
    .house-card.sansi { background: linear-gradient(135deg, #92400e 0%, #d97706 100%); border: 1px solid #fbbf24; }
    .house-card.fangcun { background: linear-gradient(135deg, #065f46 0%, #059669 100%); border: 1px solid #34d399; }
    .house-title { font-size: 0.85rem; font-weight: 800; }
    .house-score { font-size: 1.5rem; font-weight: 900; margin-top: 2px; }

    /* 切換頁籤 */
    .section-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 12px 8px; background: rgba(51, 65, 85, 0.8); color: #94a3b8;
      border: 1px solid var(--card-border); border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: #0284c7; color: white; border-color: var(--primary-blue); box-shadow: 0 0 12px rgba(56, 189, 248, 0.35); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-row { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 900px) { .grid-row { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border: 1px solid var(--card-border); backdrop-filter: blur(12px); box-sizing: border-box;
    }
    .card h2 { font-size: 1.15rem; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; color: var(--primary-blue); }

    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; color: #cbd5e1; }
    
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 12px 14px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; box-sizing: border-box; font-size: 1rem;
    }

    /* ★ 專為手機優化的大按鈕快選區 */
    .quick-score-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .btn-quick { background: #1e293b; color: #f8fafc; border: 1px solid #334155; padding: 14px 6px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    .btn-quick.minus { color: #f87171; background: #450a0a; border-color: #991b1b; }

    /* 導師按鈕手感優化 */
    .teacher-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .teacher-btn { padding: 12px 6px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .teacher-btn.selected { background: #0284c7; color: white; border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

    button.submit-btn { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; min-height: 54px; font-size: 1.15rem; border-radius: 12px; margin-top: 16px; width: 100%; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }

    /* ★ 手機端 App 風格底部固定導覽列 */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 999;
    }
    .mobile-nav-item {
      flex: 1;
      text-align: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .mobile-nav-item.active {
      color: var(--primary-blue);
    }
    .mobile-nav-icon {
      font-size: 1.3rem;
    }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #1e293b; padding: 22px; border-radius: 16px; width: 88%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--card-border); text-align: center; color: white; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btn-confirm { background: #0284c7; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; flex: 1; }
    .modal-btn-cancel { background: #475569; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; flex: 1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏰 魔法學園：Maths Dollars 管理系統 🔮</h1>
    <div class="role-badge">🧙‍♂️ 執行政務導師專用</div>
  </header>

  <div class="dashboard-houses">
    <div class="house-card yuanman">
      <div class="house-title">🔴 圓滿角</div>
      <div class="house-score" id="scoreYuanman">$0</div>
    </div>
    <div class="house-card sansi">
      <div class="house-title">🟡 三思角</div>
      <div class="house-score" id="scoreSansi">$0</div>
    </div>
    <div class="house-card fangcun">
      <div class="house-title">🟢 方寸角</div>
      <div class="house-score" id="scoreFangcun">$0</div>
    </div>
  </div>

  <div class="section-tabs">
    <button type="button" class="tab-btn active" onclick="switchTab('tabScore')">📜 頒發與發放</button>
    <button type="button" class="tab-btn" onclick="switchTab('tabActivity')">⚙️ 活動項目管理</button>
  </div>

  <div id="tabScore" class="tab-content active">
    <form id="scoreForm">
      <div class="grid-row">
        <div class="card">
          <h2>📜 存款或提款設定</h2>
          
          <div class="form-group">
            <label for="activitySelect">1. 選擇活動項目</label>
            <select id="activitySelect" onchange="onActivityChange()" required>
              <option value="">-- 請選擇活動 --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="scoreInput">2. Maths Dollars</label>
            <input type="number" id="scoreInput" value="0" inputmode="numeric" required>

            <div class="quick-score-buttons">
              <button type="button" class="btn-quick" onclick="addScoreValue(1)">+1</button>
              <button type="button" class="btn-quick" onclick="addScoreValue(5)">+5</button>
              <button type="button" class="btn-quick" onclick="addScoreValue(10)">+10</button>
              <button type="button" class="btn-quick" onclick="addScoreValue(20)">+20</button>
              <button type="button" class="btn-quick minus" onclick="addScoreValue(-5)">-5</button>
              <button type="button" class="btn-quick minus" onclick="addScoreValue(-10)">-10</button>
            </div>
          </div>

          <div class="form-group">
            <label>3. 執行政務導師認證</label>
            <div class="teacher-grid">
              <button type="button" class="teacher-btn" onclick="selectTeacher('🔴 郭老師', this)">🔴 郭老師</button>
              <button type="button" class="teacher-btn" onclick="selectTeacher('🔴 周老師', this)">🔴 周老師</button>
              <button type="button" class="teacher-btn" onclick="selectTeacher('🟡 李老師', this)">🟡 李老師</button>
              <button type="button" class="teacher-btn" onclick="selectTeacher('🟡 關老師', this)">🟡 關老師</button>
              <button type="button" class="teacher-btn" onclick="selectTeacher('🟢 梁老師', this)">🟢 梁老師</button>
              <button type="button" class="teacher-btn" onclick="selectTeacher('🟢 湯老師', this)">🟢 湯老師</button>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" id="submitScoreBtn" class="submit-btn">📜 簽署並頒發 Maths Dollars (需魔法數字)</button>
    </form>
  </div>
</div>

<!-- 底部固定 APP 手機導覽列 -->
<div class="mobile-bottom-nav">
  <a href="leaderboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🏆</span>
    <span>排行榜</span>
  </a>
  <a href="index.html" class="mobile-nav-item active">
    <span class="mobile-nav-icon">🔮</span>
    <span>管理系統</span>
  </a>
  <a href="analytics.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">📊</span>
    <span>數據查詢</span>
  </a>
</div>

<div class="modal-overlay" id="passwordModal">
  <div class="modal-card">
    <h3>🔒 導師安全驗證</h3>
    <p>請輸入「魔法數字」：</p>
    <input type="password" id="modalPasswordInput" placeholder="請輸入魔法數字" autocomplete="off" style="text-align: center; font-size: 1.2rem;">
    <div class="modal-actions">
      <button type="button" class="modal-btn-cancel" onclick="closePasswordModal(false)">取消</button>
      <button type="button" class="modal-btn-confirm" onclick="confirmPasswordModal()">確認簽署</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyGOmPnJSBM5BbN2oIdpoMSYuEJW4rtAXsAC1rJRuHEzTgo3L6s2Yd1Nqzy1L_j_BMM/exec';
  const MAGIC_NUMBER = '25762638';

  let studentDatabase = [];
  let activitiesList = [];
  let scoreRecords = [];
  let selectedTeacherName = '';
  let passwordResolver = null;

  window.onload = loadCloudData;

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
  }

  async function loadCloudData() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();
      studentDatabase = data.students || [];
      activitiesList = data.activities || [];
      scoreRecords = data.scores || [];

      renderHouseDashboard();
      renderActivityDropdowns();
    } catch (err) {}
  }

  function renderHouseDashboard() {
    const totals = { '圓滿角': 0, '三思角': 0, '方寸角': 0 };
    scoreRecords.forEach(r => {
      if ((r.scoreType === 'house' || r.scoreType === 'both') && r.house && totals[r.house] !== undefined) {
        totals[r.house] += Number(r.score) || 0;
      }
    });
    document.getElementById('scoreYuanman').innerText = '$' + totals['圓滿角'];
    document.getElementById('scoreSansi').innerText = '$' + totals['三思角'];
    document.getElementById('scoreFangcun').innerText = '$' + totals['方寸角'];
  }

  function addScoreValue(delta) {
    const input = document.getElementById('scoreInput');
    let cur = parseInt(input.value, 10) || 0;
    input.value = cur + delta;
  }

  function selectTeacher(tName, btn) {
    document.querySelectorAll('.teacher-btn').forEach(b => b.classList.remove('selected'));
    selectedTeacherName = tName;
    btn.classList.add('selected');
  }

  function renderActivityDropdowns() {
    const select = document.getElementById('activitySelect');
    select.innerHTML = '<option value="">-- 請選擇活動 --</option>';
    activitiesList.forEach(a => {
      const actName = (typeof a === 'object') ? a.name : a;
      select.innerHTML += `<option value="${actName}">${actName}</option>`;
    });
  }

  function requestPasswordModal() {
    return new Promise((resolve) => {
      passwordResolver = resolve;
      const modal = document.getElementById('passwordModal');
      const input = document.getElementById('modalPasswordInput');
      input.value = '';
      modal.classList.add('active');
      input.focus();
    });
  }

  function confirmPasswordModal() {
    const input = document.getElementById('modalPasswordInput');
    closePasswordModal(input.value);
  }

  function closePasswordModal(result) {
    const modal = document.getElementById('passwordModal');
    modal.classList.remove('active');
    if (passwordResolver) {
      passwordResolver(result);
      passwordResolver = null;
    }
  }

  document.getElementById('scoreForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedTeacherName) { alert('🧙‍♂️ 請先選擇導師身分！'); return; }
    const activity = document.getElementById('activitySelect').value;
    if (!activity) { alert('請先選擇活動！'); return; }

    const userInputPassword = await requestPasswordModal();
    if (!userInputPassword || userInputPassword !== MAGIC_NUMBER) {
      alert('❌ 魔法數字錯誤！已取消發放。');
      return;
    }

    alert('📜 發放成功！');
    loadCloudData();
  });
</script>
</body>
</html>
