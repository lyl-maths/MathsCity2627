<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏰 魔法學園：Maths Dollars 管理系統 (執行政務導師專用) 🔮</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --color-yuanman: #f87171;
      --color-sansi: #fbbf24;
      --color-fangcun: #34d399;
      --primary-blue: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      margin: 0;
      padding: 16px;
      color: #f8fafc;
      min-height: 100vh;
    }

    .container {
      max-width: 1800px;
      width: 96%;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nav-btn {
      flex: 1;
      min-width: 160px;
      text-align: center;
      padding: 12px 14px;
      background: rgba(51, 65, 85, 0.8);
      color: #94a3b8;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
    }
    .nav-btn.active {
      background: #0284c7;
      color: white;
      border-color: var(--primary-blue);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    header { text-align: center; margin-bottom: 18px; }
    header h1 { margin: 6px 0; font-size: 1.8rem; color: var(--primary-blue); }
    
    .role-badge {
      display: inline-block;
      background: rgba(15, 23, 42, 0.8);
      color: #fbbf24;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid #fbbf24;
    }

    .dashboard-houses {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 22px;
      text-align: center;
    }
    .house-card {
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      color: white;
    }
    .house-card.yuanman { background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); border: 1px solid #f87171; }
    .house-card.sansi { background: linear-gradient(135deg, #92400e 0%, #d97706 100%); border: 1px solid #fbbf24; }
    .house-card.fangcun { background: linear-gradient(135deg, #065f46 0%, #059669 100%); border: 1px solid #34d399; }
    .house-title { font-size: 1.2rem; font-weight: 800; }
    .house-score { font-size: 2.5rem; font-weight: 900; margin-top: 6px; }

    .section-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 14px 20px; background: rgba(51, 65, 85, 0.8); color: #94a3b8;
      border: 1px solid var(--card-border); border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: #0284c7; color: white; border-color: var(--primary-blue); box-shadow: 0 0 15px rgba(56, 189, 248, 0.35); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
    @media (max-width: 900px) { .grid-row { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg); padding: 24px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid var(--card-border); backdrop-filter: blur(12px); display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box;
    }
    .card h2 { font-size: 1.25rem; margin-top: 0; margin-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; color: var(--primary-blue); }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 1rem; color: #cbd5e1; }
    
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 12px 14px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; font-size: 1rem;
    }

    .checkbox-type-group { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .checkbox-type-item { display: flex; align-items: center; justify-content: flex-start; gap: 10px; font-weight: 600; font-size: 1rem; color: #f8fafc; cursor: pointer; }
    .checkbox-type-item input[type="radio"] { width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--primary-blue); }

    .house-button-group { display: flex; gap: 10px; margin-top: 8px; }
    .house-btn { flex: 1; padding: 12px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .house-btn.selected.yuanman { background: #991b1b; color: white; border-color: #f87171; }
    .house-btn.selected.sansi { background: #92400e; color: white; border-color: #fbbf24; }
    .house-btn.selected.fangcun { background: #065f46; color: white; border-color: #34d399; }

    .selected-students-zone {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px dashed #475569; border-radius: 8px; background: #0f172a; min-height: 48px; max-height: 140px; overflow-y: auto;
    }
    .pill-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.95rem; font-weight: bold; background: #334155; color: white; }
    .pill-tag.yuanman { background: #991b1b; color: #fca5a5; }
    .pill-tag.sansi { background: #92400e; color: #fde68a; }
    .pill-tag.fangcun { background: #065f46; color: #a7f3d0; }
    .pill-remove { cursor: pointer; background: rgba(0,0,0,0.3); border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; }

    .quick-score-buttons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
    @media (max-width: 600px) { .quick-score-buttons { grid-template-columns: repeat(3, 1fr); } }
    .btn-quick { background: #1e293b; color: #f8fafc; border: 1px solid #334155; padding: 10px 4px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    .btn-quick.minus { color: #f87171; background: #450a0a; border-color: #991b1b; }

    .teacher-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
    @media (min-width: 1400px) { .teacher-grid { grid-template-columns: repeat(3, 1fr); } }
    .teacher-btn { padding: 10px 6px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; text-align: center; }
    .teacher-btn.selected { background: #0284c7; color: white; border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

    .teacher-badge-status { margin-top: 8px; padding: 8px; background: rgba(2, 132, 199, 0.2); border: 1px dashed var(--primary-blue); border-radius: 8px; color: #38bdf8; font-size: 0.9rem; font-weight: bold; text-align: center; display: none; }

    button.submit-btn { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; min-height: 52px; font-size: 1.2rem; border-radius: 10px; margin-top: 16px; width: 100%; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-add { background: #059669; color: white; border: none; font-weight: bold; cursor: pointer; min-height: 46px; font-size: 1.05rem; border-radius: 8px; margin-top: auto; }
    .btn-delete { background: #dc2626; color: white; font-weight: bold; border: none; min-height: 46px; font-size: 1.05rem; border-radius: 8px; margin-top: auto; cursor: pointer; }

    .checkbox-list { max-height: 200px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; padding: 10px; background: #0f172a; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 1rem; }

    .status-bar { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    .text-yuanman { color: var(--color-yuanman); font-weight: bold; }
    .text-sansi { color: var(--color-sansi); font-weight: bold; }
    .text-fangcun { color: var(--color-fangcun); font-weight: bold; }

    .btn-action-small { width: auto; padding: 6px 12px; font-size: 0.85rem; background: #334155; color: white; border-radius: 6px; border: 1px solid #475569; cursor: pointer; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #1e293b; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--card-border); text-align: center; color: white; }
    .modal-card h3 { margin-top: 0; font-size: 1.25rem; color: var(--primary-blue); }
    .modal-card p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btn-confirm { background: #0284c7; color: white; border: none; font-weight: bold; }
    .modal-btn-cancel { background: #475569; color: white; border: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <a href="leaderboard.html" class="nav-btn">🏰 魔法學園 Maths Dollars 排行榜 🔮</a>
    <a href="index.html" class="nav-btn active">🏰 魔法學園：Maths Dollars 管理系統 🔮</a>
    <a href="analytics.html" class="nav-btn">🏰 魔法學徒數據查詢 📊</a>
  </div>

  <header>
    <h1>🏰 魔法學園：Maths Dollars 管理系統 🔮</h1>
    <div class="role-badge">🧙‍♂️ 執行政務導師專用系統</div>
    <div class="status-bar" id="syncStatus" style="margin-top: 6px;">已與魔法學園系統同步...</div>
  </header>

  <div class="dashboard-houses">
    <div class="house-card yuanman">
      <div class="house-title">🔴 圓滿角</div>
      <div class="house-score" id="scoreYuanman">$0</div>
    </div>
    <div class="house-card sansi">
      <div class="house-title">🟡 三思角</div>
      <div class="house-score" id="scoreSansi">$0</div>
    </div>
    <div class="house-card fangcun">
      <div class="house-title">🟢 方寸角</div>
      <div class="house-score" id="scoreFangcun">$0</div>
    </div>
  </div>

  <div class="section-tabs">
    <button type="button" class="tab-btn active" onclick="switchTab('tabScore')">📜 頒發與發放 Maths Dollars</button>
    <button type="button" class="tab-btn" onclick="switchTab('tabActivity')">⚙️ 活動項目管理 (新增/刪除)</button>
  </div>

  <div id="tabScore" class="tab-content active">
    <form id="scoreForm">
      <div class="grid-row">
        <div class="card">
          <div>
            <h2>📜 存款或提款設定📜</h2>
            
            <div class="form-group">
              <label for="activitySelect">1. 選擇活動項目</label>
              <select id="activitySelect" onchange="onActivityChange()" required>
                <option value="">-- 請選擇活動 --</option>
              </select>
            </div>

            <div class="form-group">
              <label for="scoreInput">2. Maths Dollars</label>
              <input type="number" id="scoreInput" value="0" inputmode="numeric" pattern="[0-9]*" required>

              <div class="quick-score-buttons">
                <button type="button" class="btn-quick" onclick="addScoreValue(1)">+1</button>
                <button type="button" class="btn-quick" onclick="addScoreValue(5)">+5</button>
                <button type="button" class="btn-quick" onclick="addScoreValue(10)">+10</button>
                <button type="button" class="btn-quick" onclick="addScoreValue(20)">+20</button>
                <button type="button" class="btn-quick minus" onclick="addScoreValue(-5)">-5</button>
                <button type="button" class="btn-quick minus" onclick="addScoreValue(-10)">-10</button>
              </div>
              <div style="text-align: right; margin-top: 4px;">
                <button type="button" class="btn-action-small" onclick="resetScoreValue()">重置數值為 0</button>
              </div>
            </div>

            <div class="form-group">
              <label>3. 執行政務之導師 (身分認證)</label>
              <div class="teacher-grid">
                <button type="button" class="teacher-btn" onclick="selectTeacher('🔴 圓滿角導師－郭老師', this)">🔴 圓滿角導師－郭老師</button>
                <button type="button" class="teacher-btn" onclick="selectTeacher('🔴 圓滿角導師－周老師', this)">🔴 圓滿角導師－周老師</button>
                <button type="button" class="teacher-btn" onclick="selectTeacher('🟡 三思角導師－李老師', this)">🟡 三思角導師－李老師</button>
                <button type="button" class="teacher-btn" onclick="selectTeacher('🟡 三思角導師－關老師', this)">🟡 三思角導師－關老師</button>
                <button type="button" class="teacher-btn" onclick="selectTeacher('🟢 方寸角導師－梁老師', this)">🟢 方寸角導師－梁老師</button>
                <button type="button" class="teacher-btn" onclick="selectTeacher('🟢 方寸角導師－湯老師', this)">🟢 方寸角導師－湯老師</button>
              </div>
              <div class="teacher-badge-status" id="teacherBadge">✨ 已獲導師印章簽署認證</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div>
            <h2>🎯 獲選之人🎯</h2>

            <div id="noActivityPrompt" style="color: #94a3b8; text-align: center; padding: 30px 0;">
              👈 請先在左側選擇活動項目...
            </div>

            <div id="houseModeSection" style="display: none;">
              <label>選擇魔法社系 (可多選)</label>
              <div class="house-button-group" style="margin-top: 8px;">
                <button type="button" class="house-btn yuanman" onclick="toggleHouseSelection('圓滿角', this)">🔴 圓滿角</button>
                <button type="button" class="house-btn sansi" onclick="toggleHouseSelection('三思角', this)">🟡 三思角</button>
                <button type="button" class="house-btn fangcun" onclick="toggleHouseSelection('方寸角', this)">🟢 方寸角</button>
              </div>
            </div>

            <div id="studentModeSection" style="display: none;">
              <div class="form-group">
                <label>已選擇學生名單 (<span id="selectedCount">0</span> 人)</label>
                <div class="selected-students-zone" id="selectedStudentsZone">
                  <span style="color: #64748b; font-size: 0.85rem;">尚未選擇任何學生...</span>
                </div>
              </div>

              <div class="form-group">
                <label for="classSelect">選擇班別</label>
                <div style="display: flex; gap: 8px;">
                  <select id="classSelect" onchange="renderStudentCheckboxes()"><option value="">-- 請選擇班別 --</option></select>
                  <button type="button" class="btn-action-small" onclick="selectAllInClass()" style="white-space: nowrap;">全班全選</button>
                </div>
              </div>

              <div class="form-group">
                <label>勾選學生</label>
                <div class="checkbox-list" id="studentCheckboxContainer"><div style="color: #64748b;">請先選擇班別</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" id="submitScoreBtn" class="submit-btn">📜 簽署並頒發 Maths Dollars (需輸入魔法數字)</button>
    </form>
  </div>

  <div id="tabActivity" class="tab-content">
    <div class="grid-row">
      <div class="card">
        <div>
          <h2>➕ 新增活動項目</h2>
          <form id="addActivityForm">
            <div class="form-group">
              <label for="newActivityName">活動名稱</label>
              <input type="text" id="newActivityName" placeholder="例如：數學遊蹤第一關" required>
            </div>

            <div class="form-group">
              <label>活動類別</label>
              <div class="checkbox-type-group">
                <label class="checkbox-type-item">
                  <input type="radio" name="activityType" value="個人修煉" checked>
                  <span>👤 個人修煉</span>
                </label>
                <label class="checkbox-type-item">
                  <input type="radio" name="activityType" value="魔法社系修煉">
                  <span>🏰 魔法社系修煉</span>
                </label>
                <label class="checkbox-type-item">
                  <input type="radio" name="activityType" value="個人與魔法社系同步修煉">
                  <span>🌟 個人與魔法社系同步修煉</span>
                </label>
              </div>
            </div>
          </form>
        </div>
        <button type="submit" form="addActivityForm" class="btn-add">建立新活動 (需魔法數字)</button>
      </div>

      <div class="card">
        <div>
          <h2>🗑️ 管理與刪除活動項目</h2>
          <div class="form-group">
            <label for="deleteActivitySelect">選擇欲刪除的活動</label>
            <select id="deleteActivitySelect"><option value="">-- 請選擇活動 --</option></select>
          </div>
        </div>
        <button type="button" class="btn-delete" onclick="handleDeleteActivity()">刪除選取活動 (需魔法數字)</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="passwordModal">
  <div class="modal-card">
    <h3>🔒 導師安全驗證</h3>
    <p>請輸入「魔法數字」以完成政務簽署：</p>
    <input type="password" id="modalPasswordInput" placeholder="請輸入魔法數字" autocomplete="off" style="text-align: center; font-size: 1.1rem; letter-spacing: 2px;">
    <div class="modal-actions">
      <button type="button" class="modal-btn-cancel" onclick="closePasswordModal(false)">取消</button>
      <button type="button" class="modal-btn-confirm" onclick="confirmPasswordModal()">簽署發放</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyGOmPnJSBM5BbN2oIdpoMSYuEJW4rtAXsAC1rJRuHEzTgo3L6s2Yd1Nqzy1L_j_BMM/exec';
  const MAGIC_NUMBER = '25762638';

  let studentDatabase = [];
  let activitiesList = [];
  let scoreRecords = [];

  let selectedStudentsMap = new Map();
  let selectedHousesSet = new Set();
  let selectedTeacherName = '';
  let passwordResolver = null;

  window.onload = loadCloudData;

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    if (tabId === 'tabScore') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
  }

  async function loadCloudData() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();
      studentDatabase = data.students || [];
      activitiesList = data.activities || [];
      scoreRecords = data.scores || [];

      renderHouseDashboard();
      renderClassDropdown();
      renderActivityDropdowns();
      document.getElementById('syncStatus').innerText = '✅ 已與魔法學園系統同步 (' + new Date().toLocaleTimeString() + ')';
    } catch (err) {
      document.getElementById('syncStatus').innerText = '❌ 同步失敗';
    }
  }

  function renderHouseDashboard() {
    const totals = { '圓滿角': 0, '三思角': 0, '方寸角': 0 };
    scoreRecords.forEach(r => {
      if ((r.scoreType === 'house' || r.scoreType === 'both') && r.house && totals[r.house] !== undefined) {
        totals[r.house] += Number(r.score) || 0;
      }
    });
    document.getElementById('scoreYuanman').innerText = '$' + totals['圓滿角'];
    document.getElementById('scoreSansi').innerText = '$' + totals['三思角'];
    document.getElementById('scoreFangcun').innerText = '$' + totals['方寸角'];
  }

  function addScoreValue(delta) {
    const input = document.getElementById('scoreInput');
    let cur = parseInt(input.value, 10) || 0;
    input.value = cur + delta;
  }

  function resetScoreValue() { document.getElementById('scoreInput').value = 0; }

  function selectTeacher(tName, btn) {
    document.querySelectorAll('.teacher-btn').forEach(b => b.classList.remove('selected'));
    selectedTeacherName = tName;
    btn.classList.add('selected');

    const badge = document.getElementById('teacherBadge');
    badge.style.display = 'block';
    badge.innerText = `✨ 已獲 [${tName}] 導師印章簽署認證`;
  }

  function toggleHouseSelection(houseName, btn) {
    if (selectedHousesSet.has(houseName)) {
      selectedHousesSet.delete(houseName);
      btn.classList.remove('selected');
    } else {
      selectedHousesSet.add(houseName);
      btn.classList.add('selected');
    }
  }

  function renderClassDropdown() {
    const select = document.getElementById('classSelect');
    const classes = [...new Set(studentDatabase.map(s => s.className).filter(Boolean))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
    select.innerHTML = '<option value="">-- 請選擇班別 --</option>';
    classes.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
  }

  function renderActivityDropdowns() {
    const select = document.getElementById('activitySelect');
    const delSelect = document.getElementById('deleteActivitySelect');

    select.innerHTML = '<option value="">-- 請選擇活動 --</option>';
    delSelect.innerHTML = '<option value="">-- 請選擇活動 --</option>';

    activitiesList.forEach(a => {
      const actName = (typeof a === 'object') ? a.name : a;
      const actType = (typeof a === 'object' && a.type) ? ` (${a.type})` : '';
      const displayLabel = `${actName}${actType}`;

      select.innerHTML += `<option value="${actName}">${displayLabel}</option>`;
      delSelect.innerHTML += `<option value="${actName}">${displayLabel}</option>`;
    });
  }

  function onActivityChange() {
    const actName = document.getElementById('activitySelect').value;
    const noPrompt = document.getElementById('noActivityPrompt');
    const houseSec = document.getElementById('houseModeSection');
    const studentSec = document.getElementById('studentModeSection');

    if (!actName) {
      noPrompt.style.display = 'block';
      houseSec.style.display = 'none';
      studentSec.style.display = 'none';
      return;
    }

    noPrompt.style.display = 'none';

    const actObj = activitiesList.find(a => (typeof a === 'object' ? a.name : a) === actName);
    const actType = (actObj && typeof actObj === 'object') ? actObj.type : '魔法社系修煉';

    if (actType === '魔法社系修煉') {
      houseSec.style.display = 'block';
      studentSec.style.display = 'none';
    } else {
      houseSec.style.display = 'none';
      studentSec.style.display = 'block';
    }
  }

  function renderStudentCheckboxes() {
    const cls = document.getElementById('classSelect').value;
    const container = document.getElementById('studentCheckboxContainer');
    container.innerHTML = '';
    if (!cls) return;

    const students = studentDatabase.filter(s => s.className === cls);
    students.forEach(s => {
      const isChecked = selectedStudentsMap.has(s.id);
      const displayName = s.name;
      container.innerHTML += `
        <label class="checkbox-item">
          <input type="checkbox" value="${s.id}" ${isChecked ? 'checked' : ''} onchange="onStudentCbChange(this, '${s.id}')">
          <span class="text-${getHouseKey(s.house)}">${displayName}</span>
        </label>`;
    });
  }

  function selectAllInClass() {
    const cls = document.getElementById('classSelect').value;
    if (!cls) { alert('請先選擇班別！'); return; }
    const students = studentDatabase.filter(s => s.className === cls);
    students.forEach(s => selectedStudentsMap.set(s.id, s));
    renderStudentCheckboxes();
    renderSelectedStudentsZone();
  }

  function onStudentCbChange(cb, id) {
    const student = studentDatabase.find(s => s.id === id);
    if (cb.checked) {
      selectedStudentsMap.set(id, student);
    } else {
      selectedStudentsMap.delete(id);
    }
    renderSelectedStudentsZone();
  }

  function renderSelectedStudentsZone() {
    const zone = document.getElementById('selectedStudentsZone');
    document.getElementById('selectedCount').innerText = selectedStudentsMap.size;

    if (selectedStudentsMap.size === 0) {
      zone.innerHTML = '<span style="color: #64748b; font-size: 0.85rem;">尚未選擇任何學生...</span>';
      return;
    }

    zone.innerHTML = '';
    selectedStudentsMap.forEach((s, id) => {
      const key = getHouseKey(s.house);
      const displayName = s.name;
      zone.innerHTML += `
        <div class="pill-tag ${key}">
          ${displayName}
          <span class="pill-remove" onclick="removeSelectedStudent('${id}')">✕</span>
        </div>`;
    });
  }

  function removeSelectedStudent(id) {
    selectedStudentsMap.delete(id);
    renderSelectedStudentsZone();
    renderStudentCheckboxes();
  }

  function requestPasswordModal() {
    return new Promise((resolve) => {
      passwordResolver = resolve;
      const modal = document.getElementById('passwordModal');
      const input = document.getElementById('modalPasswordInput');
      input.value = '';
      modal.classList.add('active');
      input.focus();
    });
  }

  function confirmPasswordModal() {
    const input = document.getElementById('modalPasswordInput');
    closePasswordModal(input.value);
  }

  function closePasswordModal(result) {
    const modal = document.getElementById('passwordModal');
    modal.classList.remove('active');
    if (passwordResolver) {
      passwordResolver(result);
      passwordResolver = null;
    }
  }

  document.getElementById('modalPasswordInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') confirmPasswordModal();
  });

  /* ★ 新增：建立新活動加上密碼驗證邏輯 ★ */
  document.getElementById('addActivityForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const actName = document.getElementById('newActivityName').value.trim();
    if (!actName) return;

    const userInputPassword = await requestPasswordModal();
    if (!userInputPassword) return;
    if (userInputPassword !== MAGIC_NUMBER) {
      alert('❌ 魔法數字錯誤！無法建立新活動。');
      return;
    }

    const actTypeObj = document.querySelector('input[name="activityType"]:checked');
    const actType = actTypeObj ? actTypeObj.value : '個人修煉';

    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'addActivity',
        activityName: actName,
        activityType: actType
      })
    });

    document.getElementById('newActivityName').value = '';
    loadCloudData();
    alert(`✨ 成功建立新活動：${actName} (${actType})！`);
  });

  async function handleDeleteActivity() {
    const actName = document.getElementById('deleteActivitySelect').value;
    if (!actName) { alert('請先選擇欲刪除的活動！'); return; }

    const userInputPassword = await requestPasswordModal();
    if (!userInputPassword) return;
    if (userInputPassword !== MAGIC_NUMBER) {
      alert('❌ 魔法數字錯誤！無法刪除活動。');
      return;
    }

    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'deleteActivity',
        activityName: actName
      })
    });

    loadCloudData();
    alert(`🗑️ 已成功刪除活動：${actName}`);
  }

  document.getElementById('scoreForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!selectedTeacherName) {
      alert('🧙‍♂️ 請先選擇執行政務之導師身分！');
      return;
    }

    const activity = document.getElementById('activitySelect').value;
    if (!activity) { alert('請先選擇活動！'); return; }

    const userInputPassword = await requestPasswordModal();
    if (!userInputPassword) return;
    if (userInputPassword !== MAGIC_NUMBER) {
      alert('❌ 魔法數字錯誤！已取消發放。');
      return;
    }

    const score = parseInt(document.getElementById('scoreInput').value, 10);
    const now = new Date().toISOString().replace('T', ' ').substring(0, 19);

    const actObj = activitiesList.find(a => (typeof a === 'object' ? a.name : a) === activity);
    const actType = (actObj && typeof actObj === 'object') ? actObj.type : '魔法社系修煉';

    let records = [];

    if (actType === '魔法社系修煉') {
      if (selectedHousesSet.size === 0) { alert('請至少選擇一個魔法社系！'); return; }
      selectedHousesSet.forEach(house => {
        records.push({
          id: 'REC_' + Date.now() + '_house_' + house,
          activity,
          scoreType: 'house',
          student: '陣營團體',
          house,
          score,
          timestamp: now,
          operator: selectedTeacherName
        });
      });
    } else {
      if (selectedStudentsMap.size === 0) { alert('請至少選擇一位學生！'); return; }
      const isBoth = (actType === '個人與魔法社系同步修煉');

      selectedStudentsMap.forEach(s => {
        records.push({
          id: 'REC_' + Date.now() + '_' + s.id,
          activity,
          scoreType: isBoth ? 'both' : 'individual',
          student: s.id || s.name,
          house: s.house,
          score,
          timestamp: now,
          operator: selectedTeacherName
        });

        if (isBoth) {
          records.push({
            id: 'REC_' + Date.now() + '_house_' + s.house,
            activity,
            scoreType: 'both',
            student: '陣營團體',
            house: s.house,
            score,
            timestamp: now,
            operator: selectedTeacherName
          });
        }
      });
    }

    for (let r of records) {
      await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addScore', data: r }) });
    }

    selectedStudentsMap.clear();
    renderSelectedStudentsZone();
    renderStudentCheckboxes();
    document.getElementById('scoreInput').value = 0;

    alert(`📜 [${selectedTeacherName}] 認證成功！已成功頒發 ${records.length} 筆 Maths Dollars！`);
    loadCloudData();
  });

  function getHouseKey(h) {
    if (h === '圓滿角') return 'yuanman';
    if (h === '三思角') return 'sansi';
    if (h === '方寸角') return 'fangcun';
    return '';
  }
</script>
</body>
</html>
