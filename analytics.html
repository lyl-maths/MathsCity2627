<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏰 魔法學徒數據查詢 📊</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --color-yuanman: #f87171;
      --color-sansi: #fbbf24;
      --color-fangcun: #34d399;
      --primary-blue: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      margin: 0;
      padding: 16px;
      color: #f8fafc;
      min-height: 100vh;
    }

    .container {
      max-width: 1800px;
      width: 96%;
      margin: 0 auto;
    }

    /* 頂部跨頁導覽列 */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nav-btn {
      flex: 1;
      min-width: 160px;
      text-align: center;
      padding: 12px 14px;
      background: rgba(51, 65, 85, 0.8);
      color: #94a3b8;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .nav-btn.active {
      background: #0284c7;
      color: white;
      border-color: var(--primary-blue);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    /* 玻璃擬態卡片容器 */
    .card { 
      background: var(--card-bg); 
      padding: 24px; 
      border-radius: 18px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
      margin-bottom: 24px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .card h2 { 
      font-size: 1.4rem; 
      margin-top: 0; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      padding-bottom: 12px; 
      margin-bottom: 18px;
      color: var(--primary-blue);
    }

    /* 三大高對比陣層分數卡 */
    .dashboard-houses {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 22px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .dashboard-houses { grid-template-columns: 1fr; }
    }

    .house-stat-card {
      padding: 22px 18px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .house-stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
    }

    .house-stat-card.yuanman {
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
      border: 1px solid #f87171;
    }
    .house-stat-card.sansi {
      background: linear-gradient(135deg, #92400e 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }
    .house-stat-card.fangcun {
      background: linear-gradient(135deg, #065f46 0%, #059669 100%);
      border: 1px solid #34d399;
    }

    .house-stat-title { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
    .house-stat-value { font-size: 2.8rem; font-weight: 900; margin-top: 8px; text-shadow: 0 3px 8px rgba(0,0,0,0.4); }

    /* 精簡過濾器 */
    .filter-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    select, input {
      padding: 12px 16px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 10px;
      flex: 1;
      min-width: 200px;
      font-size: 1rem;
      font-weight: 600;
    }

    /* 表格容器 */
    .table-container {
      max-height: 65vh;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.6);
    }

    table { width: 100%; border-collapse: collapse; }
    
    th { 
      background: #090d16; 
      color: #38bdf8;
      font-weight: 800;
      padding: 16px 14px; 
      border-bottom: 2px solid #334155; 
      text-align: center; 
      font-size: 1.15rem; 
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    
    td { 
      padding: 16px 14px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
      text-align: center; 
      font-size: 1.1rem; 
    }

    tbody tr:nth-child(odd) { background-color: rgba(30, 41, 59, 0.4); }
    tbody tr:nth-child(even) { background-color: rgba(15, 23, 42, 0.6); }

    tbody tr:hover {
      background-color: rgba(56, 189, 248, 0.18) !important;
      cursor: pointer;
    }

    .student-name-cell { font-size: 1.2rem; font-weight: 800; }

    .text-yuanman { color: var(--color-yuanman); text-shadow: 0 0 8px rgba(248, 113, 113, 0.3); }
    .text-sansi { color: var(--color-sansi); text-shadow: 0 0 8px rgba(251, 191, 36, 0.3); }
    .text-fangcun { color: var(--color-fangcun); text-shadow: 0 0 8px rgba(52, 211, 153, 0.3); }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部導覽列 -->
  <div class="nav-bar">
    <a href="leaderboard.html" class="nav-btn">🏰 魔法學園 Maths Dollars 排行榜 🔮</a>
    <a href="index.html" class="nav-btn">🏰 魔法學園：Maths Dollars 管理系統 🔮</a>
    <a href="analytics.html" class="nav-btn active">🏰 魔法學徒數據查詢 📊</a>
  </div>

  <!-- 三大魔法社系總分頂部統計卡 -->
  <div class="dashboard-houses">
    <div class="house-stat-card yuanman">
      <div class="house-stat-title">🔴 圓滿角 (社系總分)</div>
      <div class="house-stat-value" id="scoreYuanman">$0</div>
    </div>
    <div class="house-stat-card sansi">
      <div class="house-stat-title">🟡 三思角 (社系總分)</div>
      <div class="house-stat-value" id="scoreSansi">$0</div>
    </div>
    <div class="house-stat-card fangcun">
      <div class="house-stat-title">🟢 方寸角 (社系總分)</div>
      <div class="house-stat-value" id="scoreFangcun">$0</div>
    </div>
  </div>

  <!-- 數據表格卡片 -->
  <div class="card">
    <h2>📊 魔法學徒成班成績明細名冊</h2>
    
    <!-- 僅保留班別與魔法社系 Filter -->
    <div class="filter-bar">
      <select id="classFilter" onchange="renderTable()">
        <option value="ALL">所有班別</option>
      </select>
      <select id="houseFilter" onchange="renderTable()">
        <option value="ALL">所有魔法社系</option>
        <option value="圓滿角">🔴 圓滿角</option>
        <option value="三思角">🟡 三思角</option>
        <option value="方寸角">🟢 方寸角</option>
      </select>
      <input type="text" id="searchInput" placeholder="搜尋學生姓名..." onkeyup="renderTable()">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>班別</th>
            <th>學生姓名</th>
            <th>魔法社系</th>
            <th>個人 Maths Dollars</th>
            <th>魔法社系 Maths Dollars</th>
            <th>總累積 Maths Dollars</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyGOmPnJSBM5BbN2oIdpoMSYuEJW4rtAXsAC1rJRuHEzTgo3L6s2Yd1Nqzy1L_j_BMM/exec';

  let studentDatabase = [];
  let scoreRecords = [];

  window.onload = async function() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      studentDatabase = data.students || [];
      scoreRecords = data.scores || [];

      // 初始化班別選單
      const classes = [...new Set(studentDatabase.map(s => s.className).filter(Boolean))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
      const selectFilter = document.getElementById('classFilter');
      selectFilter.innerHTML = '<option value="ALL">所有班別</option>';
      classes.forEach(c => selectFilter.innerHTML += `<option value="${c}">${c}</option>`);

      renderHouseDashboard();
      renderTable();
    } catch (err) {}
  };

  function renderHouseDashboard() {
    const totals = { '圓滿角': 0, '三思角': 0, '方寸角': 0 };
    scoreRecords.forEach(r => {
      if ((r.scoreType === 'house' || r.scoreType === 'both') && r.house && totals[r.house] !== undefined) {
        totals[r.house] += Number(r.score) || 0;
      }
    });
    document.getElementById('scoreYuanman').innerText = '$' + totals['圓滿角'];
    document.getElementById('scoreSansi').innerText = '$' + totals['三思角'];
    document.getElementById('scoreFangcun').innerText = '$' + totals['方寸角'];
  }

  function isStudentMatch(recordStudentStr, studentObj) {
    if (!recordStudentStr || recordStudentStr === '陣營團體') return false;
    if (studentObj.id && recordStudentStr.includes(studentObj.id)) return true;
    if (studentObj.name && recordStudentStr.includes(studentObj.name)) return true;
    return false;
  }

  function renderTable() {
    const cls = document.getElementById('classFilter').value;
    const house = document.getElementById('houseFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase().trim();

    let list = studentDatabase;
    if (cls !== 'ALL') list = list.filter(s => s.className === cls);
    if (house !== 'ALL') list = list.filter(s => s.house === house);
    if (search !== '') list = list.filter(s => s.name.toLowerCase().includes(search) || s.id.toLowerCase().includes(search));

    const totals = { '圓滿角': 0, '三思角': 0, '方寸角': 0 };
    scoreRecords.forEach(r => {
      if ((r.scoreType === 'house' || r.scoreType === 'both') && r.house && totals[r.house] !== undefined) {
        totals[r.house] += Number(r.score) || 0;
      }
    });

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="color: #94a3b8; padding: 30px;">查無符合條件之學生數據</td></tr>';
      return;
    }

    list.forEach(s => {
      let indScore = 0;
      scoreRecords.forEach(r => {
        if (isStudentMatch(r.student, s) && r.scoreType !== 'house') {
          indScore += Number(r.score) || 0;
        }
      });

      const houseScore = totals[s.house] || 0;
      const totalAccumulated = indScore + houseScore;

      tbody.innerHTML += `
        <tr>
          <td><strong>${s.className}</strong></td>
          <td class="student-name-cell text-${getHouseKey(s.house)}">${s.name}</td>
          <td>${getHouseDisplayName(s.house)}</td>
          <td><strong>$${indScore}</strong></td>
          <td><strong>$${houseScore}</strong></td>
          <td style="color: #38bdf8; font-size: 1.25rem;"><strong>$${totalAccumulated}</strong></td>
        </tr>`;
    });
  }

  function getHouseDisplayName(h) {
    if (h === '圓滿角') return '🔴 圓滿角';
    if (h === '三思角') return '🟡 三思角';
    if (h === '方寸角') return '🟢 方寸角';
    return h || '';
  }

  function getHouseKey(h) {
    if (h === '圓滿角') return 'yuanman';
    if (h === '三思角') return 'sansi';
    if (h === '方寸角') return 'fangcun';
    return '';
  }
</script>
</body>
</html>
